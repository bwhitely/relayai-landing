<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RelayAI Workflow Demo</title>
  <meta name="description" content="45-second demo of a custom outreach automation workflow built by RelayAI.">
  <link rel="canonical" href="https://www.relayai.com.au/workflow-demo.html">
  <meta property="og:title" content="RelayAI Workflow Demo">
  <meta property="og:description" content="Watch a short walkthrough of a real outreach automation workflow.">
  <meta property="og:type" content="video.other">
  <meta property="og:url" content="https://www.relayai.com.au/workflow-demo.html">
  <meta property="og:video" content="https://www.relayai.com.au/media/outreach-workflow-demo.webm">
  <meta property="og:video:type" content="video/webm">
  <meta property="og:video:width" content="1280">
  <meta property="og:video:height" content="720">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=switzer@400,500,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111113;
      --bg-elevated: #1a1a1e;
      --bg-card: #1e1e22;
      --text: #e8e6e3;
      --text-muted: #9a9898;
      --accent: #d4952a;
      --accent-hover: #e5a83a;
      --border: #2a2a2e;
      --font-display: 'General Sans', sans-serif;
      --font-body: 'Switzer', sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    .wrap {
      width: min(980px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    h1 {
      margin-bottom: 10px;
      font-size: 28px;
      font-family: var(--font-display);
      letter-spacing: -0.02em;
    }
    p { margin-bottom: 16px; color: var(--text-muted); line-height: 1.5; }
    video {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #000;
    }
    .links {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    a {
      color: #111113;
      background: var(--accent);
      text-decoration: none;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    a:hover {
      background: var(--accent-hover);
    }
    code {
      display: block;
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border);
      overflow-wrap: anywhere;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Custom Outreach Workflow Demo</h1>
    <p>This is the exact kind of automation we build for service businesses: qualify leads, research context, generate personalized copy, send, and sync status back to your system.</p>

    <video controls preload="metadata">
      <source src="/media/outreach-workflow-demo.webm" type="video/webm">
      Your browser does not support HTML5 video.
    </video>

    <div class="links">
      <a href="/">Back to RelayAI</a>
      <a href="/media/outreach-workflow-demo.webm">Open raw video</a>
    </div>

    <code>https://www.relayai.com.au/workflow-demo.html</code>
  </main>
</body>
</html>
