<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RelayAI Workflow Demo</title>
  <meta name="description" content="45-second demo of a custom outreach automation workflow built by RelayAI.">
  <link rel="canonical" href="https://www.relayai.com.au/workflow-demo.html">
  <meta property="og:title" content="RelayAI Workflow Demo">
  <meta property="og:description" content="Watch a short walkthrough of a real outreach automation workflow.">
  <meta property="og:type" content="video.other">
  <meta property="og:url" content="https://www.relayai.com.au/workflow-demo.html">
  <meta property="og:video" content="https://www.relayai.com.au/media/outreach-workflow-demo.webm">
  <meta property="og:video:type" content="video/webm">
  <meta property="og:video:width" content="1280">
  <meta property="og:video:height" content="720">
  <meta name="robots" content="index, follow">
  <style>
    :root {
      --bg: #0b1320;
      --card: #111a2b;
      --text: #ecf2ff;
      --muted: #9eb0d1;
      --accent: #24d6a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(1000px 500px at 20% -10%, #173258 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    .wrap {
      width: min(980px, 100%);
      background: var(--card);
      border: 1px solid #1d2a42;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    video {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #243554;
      background: #000;
    }
    .links {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    a {
      color: #04130f;
      background: var(--accent);
      text-decoration: none;
      font-weight: 700;
      padding: 9px 12px;
      border-radius: 8px;
    }
    code {
      display: block;
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #0a1020;
      color: #b7c7e8;
      overflow-wrap: anywhere;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Custom Outreach Workflow Demo</h1>
    <p>This is the exact kind of automation we build for service businesses: qualify leads, research context, generate personalized copy, send, and sync status back to your system.</p>

    <video controls preload="metadata">
      <source src="/media/outreach-workflow-demo.webm" type="video/webm">
      Your browser does not support HTML5 video.
    </video>

    <div class="links">
      <a href="/">Back to RelayAI</a>
      <a href="/media/outreach-workflow-demo.webm">Open raw video</a>
    </div>

    <code>https://www.relayai.com.au/workflow-demo.html</code>
  </main>
</body>
</html>
